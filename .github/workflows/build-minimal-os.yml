name: Build Minimal Alpine ISO

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-minimal-os.yml"
      - "scripts/build-minimal-alpine-os.sh"

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso curl

      - name: Build and validate ISO
        env:
          ALPINE_VERSION: "3.20.3"
          ALPINE_ARCH: "x86_64"
        run: |
          chmod +x scripts/build-minimal-alpine-os.sh
          scripts/build-minimal-alpine-os.sh

      - name: Final ISO checks
        run: |
          test -s /tmp/minimal-alpine-gui-os.iso
          file /tmp/minimal-alpine-gui-os.iso
          xorriso -indev /tmp/minimal-alpine-gui-os.iso -toc >/dev/null
          xorriso -indev /tmp/minimal-alpine-gui-os.iso -report_el_torito plain

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: minimal-alpine-gui-os
          path: /tmp/minimal-alpine-gui-os.iso
          if-no-files-found: error
          retention-days: 14
